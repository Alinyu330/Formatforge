<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="FormatForge - 本地离线格式转换工具，支持音频、表格、图片、文档格式互转。支持QQ音乐/网易云/酷狗加密格式解密。" />
  <meta name="theme-color" content="#0f1724" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FormatForge" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('formatforge-theme');
        var light = stored === 'light'
          || (stored !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('light');
      } catch (e) {}
    })();
  </script>
  <title>FormatForge - 格式转换工具</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
